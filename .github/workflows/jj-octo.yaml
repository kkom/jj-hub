name: jj-octo

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    permissions:
      contents: read

    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: ${{ github.ref_name != 'main' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          # The same age renovate.json5 waits for before updating a dependency
          minimum_release_age: 3d

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A pull request that changes the version is a release, so the new version has to be
      # higher than the base branch's, and one npm doesn't have.
      - name: Check the version
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "${GITHUB_BASE_REF}"
          export HEAD_VERSION BASE_VERSION
          HEAD_VERSION=$(jq -r .version package.json)
          BASE_VERSION=$(git show "FETCH_HEAD:package.json" 2>/dev/null | jq -r .version || true)
          if [ "${HEAD_VERSION}" = "${BASE_VERSION}" ]; then
            exit 0
          fi
          if [ -n "${BASE_VERSION}" ] && [ "$(bun -e 'console.log(Bun.semver.order(process.env.HEAD_VERSION, process.env.BASE_VERSION))')" != 1 ]; then
            echo "::error::version ${HEAD_VERSION} isn't higher than ${BASE_VERSION} on ${GITHUB_BASE_REF}"
            exit 1
          fi
          if [ -n "$(npm view "jj-octo@${HEAD_VERSION}" version 2>/dev/null || true)" ]; then
            echo "::error::npm already has jj-octo@${HEAD_VERSION}"
            exit 1
          fi

      - name: Check
        run: bun run check

      - name: Run the built file
        run: ./dist/jj-octo.js --version

  # Runs the built file on each runtime it supports, and on the oldest Node that `engines` allows.
  built:
    name: Built file on ${{ matrix.name }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    concurrency:
      group: built-${{ matrix.name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.ref_name != 'main' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Bun
            runtime: bun
          - name: Node
            runtime: node
          - name: the oldest Node
            runtime: node
            oldest-node: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          # The same age renovate.json5 waits for before updating a dependency
          minimum_release_age: 3d

      # Steps after this one find it ahead of the Node in mise.toml.
      - name: Install the oldest Node that engines allows
        if: matrix.oldest-node
        run: |
          set -euo pipefail
          version=$(jq -r '.engines.node | ltrimstr(">=")' package.json)
          mise install "node@${version}"
          echo "$(mise where "node@${version}")/bin" >> "$GITHUB_PATH"
          echo "OLDEST_NODE=v${version}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Show the runtime
        run: ${{ matrix.runtime }} --version

      - name: Check that the oldest Node runs
        if: matrix.oldest-node
        run: test "$(node --version)" = "${OLDEST_NODE}"

      - name: Test the built file
        env:
          JJ_OCTO_RUNTIME: ${{ matrix.runtime }}
        run: bun test src/built.test.ts

  # Publishes the version in package.json when npm doesn't have it yet.
  cd:
    name: CD
    needs: [built, ci]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: write # For the tag and the GitHub release.
      id-token: write # npm takes the workflow's identity as its publish credential, so no token is stored.

    concurrency:
      group: cd

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          # The same age renovate.json5 waits for before updating a dependency
          minimum_release_age: 3d

      # `npm view` prints nothing for a version the registry doesn't have, and fails for a
      # package it doesn't have. Both leave the output empty.
      - name: Read the version
        id: version
        run: |
          version=$(jq -r .version package.json)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "published=$(npm view "jj-octo@${version}" version 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.version.outputs.published == ''
        run: bun install --frozen-lockfile

      # bun can't publish with the workflow's identity, so npm does it. `prepack` builds the file.
      - name: Publish to npm
        if: steps.version.outputs.published == ''
        run: npm publish --access public --provenance

      - name: Create the GitHub release
        if: steps.version.outputs.published == ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v${VERSION}" --generate-notes --target "${GITHUB_SHA}"
